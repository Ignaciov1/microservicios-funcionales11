<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBox SpA - Catálogo de Productos Orgánicos</title>
    <!-- Icono de pestaña actualizado a una hoja verde para representar productos saludables -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F343;</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>FreshBox SpA</h1>
        <p>Gestión CRUD de Productos Orgánicos y Saludables - Docker + EC2 + MySQL</p>
    </header>
    <main>
        <section id="productos-section">
            <h2>Catálogo de Productos</h2>
            <button id="btn-cargar" onclick="cargarProductos()">Cargar catálogo</button>
            <table id="tabla-productos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productos-body"></tbody>
            </table>
        </section>
        <section id="formulario-section">
            <h2 id="form-titulo">Nuevo Producto</h2>
            <form id="producto-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="producto-id">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" min="1" step="10" required>
                </div>
                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" min="0" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria">
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-guardar">Guardar</button>
                    <button type="button" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
            <p id="mensaje"></p>
        </section>
    </main>
    <footer>
        <p>FreshBox SpA - Evaluación Parcial 1 - ARY1102 Arquitectura Cloud - Duoc UC 2026</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
